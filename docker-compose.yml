# Gente, esto levanta lo mínimo del Hito 1: PostgreSQL y la API.
# Los valores por defecto son de ejemplo; si quieren otros, pongan un .env en la raíz.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factura}
      POSTGRES_DB: ${POSTGRES_DB:-factura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factura} -d ${POSTGRES_DB:-factura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-factura}:${POSTGRES_PASSWORD:-factura}@db:5432/${POSTGRES_DB:-factura}
      FACTURA_HMAC_KEY: ${FACTURA_HMAC_KEY:?Define FACTURA_HMAC_KEY en tu .env}
      API_KEY: ${API_KEY:?Define API_KEY en tu .env}
    ports:
      - "8000:8000"
    # Modelos entrenados: persisten acá y nunca entran a Git.
    volumes:
      - ./backend/ml_models:/app/ml_models
    # Esperamos a la db, pasamos migraciones y recién ahí arranca uvicorn.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
